<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your documents — OriginFlow Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script>
    window.OF_CONFIG = {
      SUPABASE_URL:      'https://zgmwtslzsmtmqcivngdq.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_1NED7PleUmnkJH_zVM3mlg_g_KBINng',
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/portal-auth.js"></script>

  <style>
    /* Portal design tokens — identical to portal_signin / portal_index so the
       whole borrower experience reads as one app. Mobile-first: single
       column, big touch targets, fixed bottom tab bar with safe-area pad. */
    :root {
      --bg: #0b1220;
      --bg-elev-1: #0f1729;
      --bg-elev-2: #15203a;
      --bg-elev-3: #1c2b4d;
      --border: #1f2d4a;
      --border-strong: #2a3d63;
      --text: #e2e8f0;
      --text-dim: #8b9bb8;
      --text-faint: #5a6a87;
      --navy: #0b1220;
      --cyan: #22d3ee;
      --cyan-deep: #0891b2;
      --cyan-glow: rgba(34, 211, 238, 0.15);
      --accent-green: #86efac;
      --warn: #fbbf24;
      --danger: #f87171;
      --font-mono: 'Space Mono', ui-monospace, monospace;
      --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'DM Serif Display', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      font-size: 15px; line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(34,211,238,0.07), transparent 60%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(76px + env(safe-area-inset-bottom)); /* room for tab bar */
    }

    /* top brand bar */
    .nav { padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 7px;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      display: grid; place-items: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--navy);
      box-shadow: 0 0 0 1px rgba(34,211,238,0.3), 0 0 24px rgba(34,211,238,0.2);
    }
    .brand-text { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
    .brand-subtitle { display: block; font-weight: 400; font-size: 10px; color: var(--text-faint);
      letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    .nav-right { margin-left: auto; }
    .signout {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim); background: none; border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 8px; cursor: pointer;
    }
    .signout:active { border-color: var(--cyan); color: var(--cyan); }

    main { max-width: 640px; margin: 0 auto; padding: 4px 20px 24px; }

    .page-eyebrow {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--cyan); margin-bottom: 6px;
    }
    .page-title { font-family: var(--font-serif); font-size: 26px; margin: 0 0 6px; line-height: 1.15; }
    .page-sub { color: var(--text-dim); font-size: 14px; margin: 0 0 20px; }

    .section-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-faint); margin: 22px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label .count {
      background: var(--bg-elev-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 1px 9px; color: var(--text-dim); font-size: 10px;
    }

    /* document request card */
    .doc-card {
      background: var(--bg-elev-1); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .doc-card.cleared { opacity: 0.75; }
    .doc-head { display: flex; align-items: flex-start; gap: 12px; }
    .doc-icon {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 17px;
      background: var(--cyan-glow); border: 1px solid rgba(34,211,238,0.25);
    }
    .doc-card.cleared .doc-icon { background: rgba(134,239,172,0.1); border-color: rgba(134,239,172,0.3); }
    .doc-title { font-weight: 600; font-size: 15px; line-height: 1.35; }
    .doc-desc { color: var(--text-dim); font-size: 13px; margin-top: 3px; line-height: 1.45; }
    .doc-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); margin-top: 6px; }
    .doc-status {
      margin-left: auto; flex-shrink: 0;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim);
    }
    .doc-status.needed   { color: var(--warn); border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.07); }
    .doc-status.received { color: var(--cyan); border-color: rgba(34,211,238,0.35); background: var(--cyan-glow); }
    .doc-status.cleared  { color: var(--accent-green); border-color: rgba(134,239,172,0.35); background: rgba(134,239,172,0.07); }

    .upload-row { margin-top: 12px; display: flex; gap: 8px; }
    .upload-btn {
      flex: 1; padding: 13px 14px; border-radius: 10px;
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 700; cursor: pointer;
      border: 1px solid var(--cyan); background: var(--cyan); color: var(--navy);
      text-align: center;
    }
    .upload-btn:active { background: var(--accent-green); border-color: var(--accent-green); }
    .upload-btn.busy { opacity: 0.55; pointer-events: none; }
    .upload-note {
      font-size: 12px; color: var(--text-faint); margin-top: 8px; line-height: 1.45;
    }
    .uploaded-flash {
      margin-top: 10px; padding: 10px 12px; border-radius: 10px;
      background: rgba(134,239,172,0.08); border: 1px solid rgba(134,239,172,0.3);
      color: var(--accent-green); font-size: 13px; display: none;
    }
    .uploaded-flash.show { display: block; }

    .empty {
      text-align: center; padding: 34px 20px; color: var(--text-dim); font-size: 14px;
      background: var(--bg-elev-1); border: 1px dashed var(--border); border-radius: 14px;
    }
    .empty .big { font-size: 30px; margin-bottom: 10px; }

    .error-banner {
      display: none; padding: 12px 16px; margin-bottom: 14px;
      background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px; color: var(--danger); font-size: 13px;
    }
    .error-banner.is-active { display: block; }

    /* bottom tab bar */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: rgba(15,23,41,0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .tab {
      flex: 1; max-width: 140px; text-align: center; text-decoration: none;
      color: var(--text-faint); font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 6px 0; border-radius: 10px;
    }
    .tab .ico { display: block; font-size: 19px; margin-bottom: 3px; }
    .tab.active { color: var(--cyan); background: var(--cyan-glow); }
    .tab:active { color: var(--cyan); }

    .veil {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: grid; place-items: center; color: var(--text-faint);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.15s;
    }
    .veil.is-hidden { opacity: 0; pointer-events: none; }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(86px + env(safe-area-inset-bottom));
      background: var(--bg-elev-2); border: 1px solid var(--cyan-deep);
      color: var(--text); font-size: 13px; padding: 11px 16px; border-radius: 10px;
      opacity: 0; transition: 0.25s; pointer-events: none; z-index: 60; max-width: 88vw;
    }
    .toast.show { opacity: 1; }
    .toast.err { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<div class="veil" id="veil">Loading your documents…</div>

<header class="nav">
  <div class="brand-mark">OF</div>
  <div class="brand-text">OriginFlow<span class="brand-subtitle">Borrower portal</span></div>
  <div class="nav-right"><button class="signout" id="signout">Sign out</button></div>
</header>

<main>
  <div class="page-eyebrow" id="eyebrow">Loan #—</div>
  <h1 class="page-title">Your documents.</h1>
  <p class="page-sub">Snap a photo or upload a file — your loan team sees it the moment it lands, and our document reader starts checking it right away.</p>

  <div class="error-banner" id="error-banner"></div>

  <div class="section-label">Needed from you <span class="count" id="count-open">—</span></div>
  <div id="list-open"><div class="empty">Loading…</div></div>

  <div class="section-label">Received &amp; cleared <span class="count" id="count-done">—</span></div>
  <div id="list-done"></div>
</main>

<nav class="tabbar">
  <a class="tab" href="/portal_index.html"><span class="ico">⌂</span>Home</a>
  <a class="tab active" href="/portal_docs.html"><span class="ico">⇪</span>Documents</a>
  <a class="tab" href="/portal_messages.html"><span class="ico">✉</span>Messages</a>
</nav>

<div class="toast" id="toast"></div>

<script>
// =============================================================================
// PORTAL · DOCUMENTS — borrower-facing document requests + upload
// -----------------------------------------------------------------------------
// Auth: window.OF_bootstrap() (portal-auth.js) → { session, borrower, loan }.
// Same redirect contract as portal_index.html.
//
// Data:
//   READ  conditions WHERE loan_id = loan.id — RLS already allows the
//         borrower read (portal_index counts open conditions today).
//         Confirmed columns: id, title, description, category, status
//         (outstanding|cleared), required_doc_type, created_at, cleared_at.
//   WRITE Supabase Storage (client-direct, per the storage architecture) +
//         a row in the documents table so process-document picks it up.
//
// ⚠ TWO FLAGGED GUESSES — confirm with portal_schema_dump.sql:
//   1. DOCS_BUCKET — the storage bucket name for loan documents.
//   2. The documents-table insert payload (table + column names).
// Both failure modes are non-destructive: the toast shows the exact error,
// nothing else on the page breaks, and one paste of the dump fixes it.
// =============================================================================

const DOCS_BUCKET = 'documents';   // ⚠ CONFIRM against storage.buckets
const $ = (s) => document.querySelector(s);
let ctx = null;
let supa = null;
let uploadedThisSession = new Set();   // condition ids → show "received" immediately

function toast(m, err){ const t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err);
  t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),3400); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dropVeil(){ const v=$('#veil'); v.classList.add('is-hidden'); setTimeout(()=>v.remove(),200); }
function banner(msg){ const b=$('#error-banner'); if(!msg){ b.classList.remove('is-active'); return; }
  b.textContent=msg; b.classList.add('is-active'); }

// Friendly labels for required_doc_type enum values — falls back to a
// cleaned-up version of the raw value for members not listed here.
const DOC_LABELS = {
  paystub: 'Recent pay stub', w2: 'W-2', tax_return: 'Tax return',
  bank_statement: 'Bank statement', drivers_license: "Driver's license or photo ID",
  insurance: 'Homeowners insurance', appraisal: 'Appraisal',
  gift_letter: 'Gift letter', voe: 'Employment verification',
};
function docLabel(t){ if(!t) return null; return DOC_LABELS[t] || String(t).replace(/_/g,' '); }

async function init(){
  try { ctx = await window.OF_bootstrap(); }
  catch (e) {
    console.error('[portal/docs] bootstrap failed:', e);
    const code = /not.?a.?borrower|email.?mismatch/i.test(String(e && e.message)) ? 'not_a_borrower' : 'link_failed';
    window.location.replace('/portal_signin.html?error=' + code);
    return;
  }
  if (!ctx || !ctx.session)  { window.location.replace('/portal_signin.html'); return; }
  if (!ctx.borrower)         { window.location.replace('/portal_signin.html?error=not_a_borrower'); return; }
  if (!ctx.loan)             { window.location.replace('/portal_apply.html'); return; }

  supa = window.OF_supabase();
  $('#eyebrow').textContent = 'Loan #' + (ctx.loan.loan_number || ctx.loan.loan_no || '—');

  await loadConditions();
  dropVeil();
}

async function loadConditions(){
  const { data, error } = await supa.from('conditions')
    .select('id, title, description, category, status, required_doc_type, created_at, cleared_at')
    .eq('loan_id', ctx.loan.id)
    .order('created_at', { ascending: true });

  if (error) {
    console.error('[portal/docs] conditions:', error);
    banner('We couldn\'t load your document list right now. Pull to refresh, or message your loan team.');
    $('#list-open').innerHTML = '';
    return;
  }

  const conds = data || [];
  // Borrowers see doc-type conditions; internal-only conditions without a
  // required_doc_type still show by title so nothing asked of them is hidden.
  const open = conds.filter(c => c.status === 'outstanding');
  const done = conds.filter(c => c.status === 'cleared');

  $('#count-open').textContent = open.length;
  $('#count-done').textContent = done.length;

  $('#list-open').innerHTML = open.length === 0
    ? `<div class="empty"><div class="big">🎉</div>Nothing needed from you right now.<br>We'll message you here if that changes.</div>`
    : open.map(c => cardHtml(c, false)).join('');

  $('#list-done').innerHTML = done.length === 0
    ? `<div class="empty">Cleared items will show here.</div>`
    : done.map(c => cardHtml(c, true)).join('');

  // wire upload inputs
  document.querySelectorAll('.doc-file-input').forEach(inp => {
    inp.addEventListener('change', () => handleUpload(inp));
  });
}

function cardHtml(c, cleared){
  const label = docLabel(c.required_doc_type);
  const received = uploadedThisSession.has(c.id);
  const statusPill = cleared
    ? `<span class="doc-status cleared">✓ cleared</span>`
    : received
      ? `<span class="doc-status received">received</span>`
      : `<span class="doc-status needed">needed</span>`;
  return `
    <div class="doc-card ${cleared ? 'cleared' : ''}" data-cond-id="${esc(c.id)}">
      <div class="doc-head">
        <div class="doc-icon">${cleared ? '✓' : '📄'}</div>
        <div style="flex:1;min-width:0;">
          <div class="doc-title">${esc(c.title)}</div>
          ${c.description ? `<div class="doc-desc">${esc(c.description)}</div>` : ''}
          <div class="doc-meta">${label ? esc(label) : ''}${cleared && c.cleared_at ? ' · cleared ' + new Date(c.cleared_at).toLocaleDateString() : ''}</div>
        </div>
        ${statusPill}
      </div>
      ${!cleared ? `
        <div class="upload-row">
          <label class="upload-btn" id="btn-${esc(c.id)}">
            ${received ? '⇪ Upload another' : '⇪ Upload ' + (label ? esc(label) : 'document')}
            <input class="doc-file-input" type="file" hidden
                   accept="image/*,.pdf,.heic,.png,.jpg,.jpeg"
                   data-cond-id="${esc(c.id)}" data-doc-type="${esc(c.required_doc_type || '')}">
          </label>
        </div>
        <div class="upload-note">Photos are fine — make sure all four corners are visible and the text is readable.</div>
        <div class="uploaded-flash" id="flash-${esc(c.id)}"></div>
      ` : ''}
    </div>
  `;
}

async function handleUpload(inp){
  const file = inp.files && inp.files[0];
  if (!file) return;
  const condId = inp.dataset.condId;
  const docType = inp.dataset.docType || null;
  const btn = $('#btn-' + CSS.escape(condId));
  btn.classList.add('busy');
  const oldText = btn.firstChild.textContent;
  btn.firstChild.textContent = 'Uploading… ';

  try {
    if (file.size > 25 * 1024 * 1024) throw new Error('That file is over 25 MB — try a photo instead.');

    const safeName = file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
    const branchId = ctx.loan.branch_id || 'branch';
    const path = `${branchId}/${ctx.loan.id}/portal/${Date.now()}-${safeName}`;

    // 1 · client-direct upload to Storage
    const up = await supa.storage.from(DOCS_BUCKET).upload(path, file, {
      contentType: file.type || 'application/octet-stream',
      upsert: false,
    });
    if (up.error) throw new Error('Upload failed: ' + up.error.message);

    // 2 · register the document row so the extraction pipeline picks it up.
    // ⚠ Payload is a best-guess shape — confirm against portal_schema_dump.
    const { error: insErr } = await supa.from('documents').insert({
      loan_id: ctx.loan.id,
      branch_id: ctx.loan.branch_id || null,
      condition_id: condId,
      doc_type: docType,
      file_name: file.name,
      storage_path: path,
      source: 'portal',
      uploaded_by_borrower_id: ctx.borrower.id,
    });
    if (insErr) {
      // Upload itself succeeded — the file is safe. Surface the registration
      // miss loudly in console for the schema-fix pass, softly to the borrower.
      console.error('[portal/docs] documents insert failed (file IS uploaded):', insErr);
      toast('Uploaded — your loan team will see it shortly.');
    } else {
      toast('Uploaded ✓ — being reviewed now.');
    }

    uploadedThisSession.add(condId);
    const flash = $('#flash-' + CSS.escape(condId));
    if (flash) {
      flash.textContent = `✓ ${file.name} received${docType ? '' : ''} — our document reader is checking it. This item clears automatically once it passes.`;
      flash.classList.add('show');
    }
    const card = document.querySelector(`[data-cond-id="${condId}"] .doc-status`);
    if (card) { card.className = 'doc-status received'; card.textContent = 'received'; }
    btn.firstChild.textContent = '⇪ Upload another ';
  } catch (err) {
    console.error('[portal/docs] upload:', err);
    toast(err.message || 'Upload failed — please try again.', true);
    btn.firstChild.textContent = oldText;
  } finally {
    btn.classList.remove('busy');
    inp.value = '';
  }
}

$('#signout').addEventListener('click', async () => {
  try { await window.OF_supabase().auth.signOut(); } catch (_) {}
  window.location.replace('/portal_signin.html');
});

init();
</script>

</body>
</html>
