<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OriginFlow Portal — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       Phase 11.5.8 — Borrower↔LO messaging
       -----------------------------------------------------------------------
       Reuses the same data model as your internal file chat (chat_channels +
       chat_messages on internal loan files), but exposes only a single
       channel per loan: the borrower-facing one. Internal-team channels
       (LO/processor/UW private threads) are filtered out by RLS.

       UI is intentionally NOT Slack-style — borrowers don't multitask
       through chat. It's a single conversation, big read area, one input.
       Messages from the team get a colored left-rail border (cyan for LO,
       green for processor, etc) so the borrower knows who they're talking
       to. Borrower's own messages are right-aligned with a subtle bg tint.

       Pipeline (11.5.8 backend):
         1. Channel auto-creates on first message — kind='loan_borrower',
            loan_id set, scoped via RLS so only the loan's borrowers + the
            assigned LO/processor/UW can read/write
         2. Supabase realtime subscription on chat_messages keeps the UI
            live without polling
         3. Email + push notification to LO when borrower sends a message
            outside business hours
       ========================================================================= */
    :root {
      --bg: #0b1220;
      --bg-elev-1: #0f1729;
      --bg-elev-2: #15203a;
      --bg-elev-3: #1c2b4d;
      --border: #1f2d4a;
      --border-strong: #2a3d63;
      --text: #e2e8f0;
      --text-dim: #8b9bb8;
      --text-faint: #5a6a87;
      --navy: #0b1220;
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.15);
      --accent-green: #86efac;
      --warn: #fbbf24;
      --danger: #f87171;

      --font-mono: 'Space Mono', ui-monospace, monospace;
      --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'DM Serif Display', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(ellipse 100% 60% at 50% 0%, rgba(34, 211, 238, 0.04), transparent 60%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .portal-banner {
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.1), rgba(134, 239, 172, 0.08));
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-align: center;
    }
    .portal-nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 18, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-shrink: 0;
    }
    .portal-brand { display: flex; align-items: center; gap: 10px; }
    .portal-brand-mark {
      width: 28px; height: 28px; border-radius: 6px;
      background: linear-gradient(135deg, var(--cyan), #0891b2);
      display: grid; place-items: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--navy);
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.3), 0 0 20px rgba(34, 211, 238, 0.2);
    }
    .portal-brand-text { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
    .portal-brand-text .subtitle {
      display: block; font-weight: 400; font-size: 10px;
      color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px;
    }
    .back-link {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim); display: flex; align-items: center; gap: 6px;
    }
    .back-link:hover { color: var(--cyan); text-decoration: none; }

    /* ─── CONVERSATION SHELL ─── */
    .convo-shell {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    @media (min-width: 640px) {
      .convo-shell { padding: 0 24px; }
    }

    /* ─── HEADER (LO context + page title) ─── */
    .convo-header {
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .convo-lo-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #0891b2);
      display: grid; place-items: center;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 18px;
      color: var(--navy);
      flex-shrink: 0;
      position: relative;
    }
    .convo-lo-avatar::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent-green);
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px rgba(134, 239, 172, 0.6);
    }
    .convo-lo-info {
      flex: 1;
      min-width: 0;
    }
    .convo-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 2px;
    }
    .convo-lo-name {
      font-family: var(--font-serif);
      font-size: 22px;
      line-height: 1.1;
      margin: 0 0 2px;
    }
    .convo-lo-meta {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .convo-loan-no {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
    }

    /* ─── MESSAGES THREAD ─── */
    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* Day separator */
    .day-separator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 4px;
    }
    .day-separator::before,
    .day-separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .day-separator-text {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    /* Message bubble */
    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 80%;
    }
    .message.is-team {
      align-self: flex-start;
    }
    .message.is-borrower {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      padding: 0 12px;
    }
    .message-author {
      color: var(--text-dim);
      margin-right: 6px;
    }
    .message.is-team .message-author { color: var(--cyan); }
    .message.is-team.is-processor .message-author { color: var(--accent-green); }
    .message.is-team.is-uw .message-author { color: var(--warn); }
    .message.is-team.is-system .message-author { color: var(--text-faint); }

    .message-bubble {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.is-team .message-bubble {
      background: var(--bg-elev-1);
      border: 1px solid var(--border);
      border-left: 3px solid var(--cyan);
      border-bottom-left-radius: 4px;
    }
    .message.is-team.is-processor .message-bubble {
      border-left-color: var(--accent-green);
    }
    .message.is-team.is-uw .message-bubble {
      border-left-color: var(--warn);
    }
    .message.is-team.is-system .message-bubble {
      border-left-color: var(--text-faint);
      background: var(--bg-elev-2);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 12px;
      font-style: italic;
    }
    .message.is-borrower .message-bubble {
      background: var(--cyan-glow);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }
    .empty-state-icon {
      font-family: var(--font-serif);
      font-size: 40px;
      color: var(--text-faint);
      margin-bottom: 12px;
    }
    .empty-state-title {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--text);
      margin: 0 0 6px;
    }
    .empty-state-subtitle {
      font-size: 14px;
      max-width: 360px;
    }

    /* ─── COMPOSE BAR ─── */
    .compose {
      position: sticky;
      bottom: 0;
      padding: 12px 0 16px;
      background: linear-gradient(180deg, transparent, var(--bg) 30%);
      flex-shrink: 0;
    }
    .compose-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-elev-1);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      transition: border-color 0.15s;
    }
    .compose-row:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-glow);
    }
    .compose-input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 8px 10px;
      resize: none;
      max-height: 140px;
      min-height: 24px;
      line-height: 1.45;
    }
    .compose-input::placeholder {
      color: var(--text-faint);
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--cyan);
      color: var(--navy);
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) {
      background: var(--accent-green);
      transform: translateY(-1px);
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .compose-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 0.04em;
      text-align: center;
      margin-top: 6px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elev-2);
      border: 1px solid var(--cyan);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.is-error { border-color: var(--danger); }
  </style>
</head>
<body>

<div class="portal-banner">Your loan — secured borrower portal</div>

<header class="portal-nav">
  <div class="portal-brand">
    <div class="portal-brand-mark">OF</div>
    <div class="portal-brand-text">
      OriginFlow
      <span class="subtitle">Borrower portal</span>
    </div>
  </div>
  <a class="back-link" href="/portal/">← Home</a>
</header>

<div class="convo-shell">

  <!-- ─── HEADER ─── -->
  <header class="convo-header">
    <div class="convo-lo-avatar" id="lo-avatar">—</div>
    <div class="convo-lo-info">
      <div class="convo-eyebrow">Your loan team</div>
      <div class="convo-lo-name" id="lo-name">—</div>
      <div class="convo-lo-meta" id="lo-meta">—</div>
    </div>
    <span class="convo-loan-no" id="loan-no">—</span>
  </header>

  <!-- ─── MESSAGES ─── -->
  <div class="thread" id="thread">
    <!-- populated by render() -->
  </div>

  <!-- ─── COMPOSE ─── -->
  <div class="compose">
    <div class="compose-row">
      <textarea
        class="compose-input"
        id="compose-input"
        placeholder="Message your loan team…"
        rows="1"
        maxlength="2000"></textarea>
      <button class="send-btn" id="send-btn" aria-label="Send" disabled>→</button>
    </div>
    <div class="compose-hint">Messages are stored with your loan file · responses usually within a few business hours</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* =============================================================================
   BOOTSTRAP DATA
   -----------------------------------------------------------------------------
   When 11.5.8 wires the backend, replace this with:
     const sb = supabaseClient();
     const { data: { user } } = await sb.auth.getUser();
     const { data: channel } = await sb.from('chat_channels')
       .select('id, loan_id, label')
       .eq('loan_id', currentLoanId)
       .eq('kind', 'loan_borrower')
       .maybeSingle();
     const { data: messages } = await sb.from('chat_messages_enriched')
       .select('*')
       .eq('channel_id', channel.id)
       .order('created_at', { ascending: true })
       .limit(200);
   Plus a realtime subscription on chat_messages filtered by channel_id.
   ============================================================================= */
window.OF_MESSAGES_BOOTSTRAP = {
  borrower: {
    id: '20000000-0000-0000-0000-000000000001',
    first_name: 'Marcus',
    last_name: 'Holbrook',
  },
  loan: {
    loan_no: 'OF-1043',
  },
  lo: {
    name: 'Avery Sutton',
    title: 'Loan Officer · NMLS #1924401',
    initials: 'AS',
    online: true,
  },
  messages: [
    {
      id: 'm1',
      created_at: '2026-05-12T14:30:00Z',
      author: { name: 'OriginFlow', role: 'system' },
      body: 'Avery Sutton was assigned as your loan officer.',
      is_borrower: false,
    },
    {
      id: 'm2',
      created_at: '2026-05-12T15:02:00Z',
      author: { name: 'Avery Sutton', role: 'lo' },
      body: "Hi Marcus — welcome! I've started a file for your purchase in Lubbock. I'll send over the disclosures shortly, and once you've signed them I'll request a few documents to verify your income and assets. Sound good?",
      is_borrower: false,
    },
    {
      id: 'm3',
      created_at: '2026-05-12T18:14:00Z',
      author: { name: 'Marcus Holbrook', role: 'borrower' },
      body: 'Sounds great — looking forward to it. One question, do you need anything from my wife? She isn\'t on the loan but we live in TX so I wasn\'t sure.',
      is_borrower: true,
    },
    {
      id: 'm4',
      created_at: '2026-05-13T09:11:00Z',
      author: { name: 'Avery Sutton', role: 'lo' },
      body: 'Good question. Texas is a community property state so we\'ll need her to sign a few things at closing (she\'ll be a "non-borrowing spouse"). I don\'t need her income or credit — just her name and DOB for the file. I\'ll send an invite link you can forward to her so she can fill her info in.',
      is_borrower: false,
    },
    {
      id: 'm5',
      created_at: '2026-05-19T08:14:00Z',
      author: { name: 'Sarah Hayes', role: 'processor' },
      body: 'Hi Marcus, Sarah here — I\'m the processor on your file. The AI cleared your paystub this morning, but I\'d like one more thing: a 60-day bank statement for any account you\'ll use for closing funds. Whenever you have a sec.',
      is_borrower: true ? false : false, // team message
    },
    {
      id: 'm6',
      created_at: '2026-05-19T08:18:00Z',
      author: { name: 'Marcus Holbrook', role: 'borrower' },
      body: 'On it — uploading from my phone now.',
      is_borrower: true,
    },
  ],
};

// Force message 5 to be team (the inline ternary above is a typo guard).
window.OF_MESSAGES_BOOTSTRAP.messages[4].is_borrower = false;

/* =============================================================================
   RENDER
   ============================================================================= */
function render() {
  const b = window.OF_MESSAGES_BOOTSTRAP;

  // Header
  document.getElementById('lo-avatar').textContent = b.lo.initials;
  document.getElementById('lo-name').textContent = b.lo.name;
  document.getElementById('lo-meta').textContent = b.lo.title;
  document.getElementById('loan-no').textContent = b.loan.loan_no;

  // Thread
  const thread = document.getElementById('thread');
  thread.innerHTML = '';

  if (b.messages.length === 0) {
    thread.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">◌</div>
        <div class="empty-state-title">No messages yet</div>
        <div class="empty-state-subtitle">Send the first message to start a conversation with your loan team.</div>
      </div>
    `;
    return;
  }

  // Group by day
  let lastDay = null;
  for (const msg of b.messages) {
    const day = formatDay(msg.created_at);
    if (day !== lastDay) {
      const sep = document.createElement('div');
      sep.className = 'day-separator';
      sep.innerHTML = `<span class="day-separator-text">${day}</span>`;
      thread.appendChild(sep);
      lastDay = day;
    }
    thread.appendChild(renderMessage(msg));
  }

  // Scroll to bottom
  requestAnimationFrame(() => {
    thread.scrollTop = thread.scrollHeight;
  });
}

function renderMessage(msg) {
  const el = document.createElement('div');
  el.className = 'message';
  if (msg.is_borrower) {
    el.classList.add('is-borrower');
  } else {
    el.classList.add('is-team');
    if (msg.author.role) el.classList.add('is-' + msg.author.role);
  }

  const time = formatTime(msg.created_at);
  const author = msg.is_borrower ? 'You' : msg.author.name;

  el.innerHTML = `
    <div class="message-meta">
      ${msg.is_borrower
        ? `<span>${escapeHtml(time)}</span> · <span class="message-author">${escapeHtml(author)}</span>`
        : `<span class="message-author">${escapeHtml(author)}</span> · <span>${escapeHtml(time)}</span>`}
    </div>
    <div class="message-bubble">${escapeHtml(msg.body)}</div>
  `;
  return el;
}

function formatDay(iso) {
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  if (isToday) return 'Today';
  if (isYesterday) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

/* =============================================================================
   COMPOSE — autoresize + send
   ============================================================================= */
function wireCompose() {
  const input = document.getElementById('compose-input');
  const sendBtn = document.getElementById('send-btn');

  // Autoresize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    sendBtn.disabled = input.value.trim().length === 0;
  });

  // Send on Enter (Shift+Enter = newline)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
}

async function sendMessage() {
  const input = document.getElementById('compose-input');
  const sendBtn = document.getElementById('send-btn');
  const body = input.value.trim();
  if (!body) return;

  // Optimistic append
  const optimistic = {
    id: 'tmp_' + Date.now(),
    created_at: new Date().toISOString(),
    author: { name: 'You', role: 'borrower' },
    body,
    is_borrower: true,
  };
  window.OF_MESSAGES_BOOTSTRAP.messages.push(optimistic);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  render();

  // Backend hook
  try {
    if (typeof window.OF_sendBorrowerMessage === 'function') {
      await window.OF_sendBorrowerMessage(body);
    } else {
      // Stub mode — pretend it succeeded
      await new Promise(res => setTimeout(res, 300));
    }
  } catch (err) {
    console.error('send failed:', err);
    showToast("Couldn't send. " + (err.message || ''), true);
    // Roll back optimistic message
    window.OF_MESSAGES_BOOTSTRAP.messages = window.OF_MESSAGES_BOOTSTRAP.messages.filter(m => m.id !== optimistic.id);
    render();
  }
}

let toastTimer = null;
function showToast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('is-error', !!isError);
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-visible'), 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  render();
  wireCompose();
});
</script>

</body>
</html>
