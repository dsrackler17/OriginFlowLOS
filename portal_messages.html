<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Messages — OriginFlow Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script>
    window.OF_CONFIG = {
      SUPABASE_URL:      'https://zgmwtslzsmtmqcivngdq.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_1NED7PleUmnkJH_zVM3mlg_g_KBINng',
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/portal-auth.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --bg-elev-1: #0f1729;
      --bg-elev-2: #15203a;
      --bg-elev-3: #1c2b4d;
      --border: #1f2d4a;
      --border-strong: #2a3d63;
      --text: #e2e8f0;
      --text-dim: #8b9bb8;
      --text-faint: #5a6a87;
      --navy: #0b1220;
      --cyan: #22d3ee;
      --cyan-deep: #0891b2;
      --cyan-glow: rgba(34, 211, 238, 0.15);
      --accent-green: #86efac;
      --danger: #f87171;
      --font-mono: 'Space Mono', ui-monospace, monospace;
      --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'DM Serif Display', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 15px; line-height: 1.5;
      color: var(--text); background: var(--bg);
      background-image: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(34,211,238,0.07), transparent 60%);
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      height: 100dvh;
    }

    .nav { padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 7px;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      display: grid; place-items: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--navy);
      box-shadow: 0 0 0 1px rgba(34,211,238,0.3), 0 0 24px rgba(34,211,238,0.2);
    }
    .brand-text { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
    .brand-subtitle { display: block; font-weight: 400; font-size: 10px; color: var(--text-faint);
      letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    .nav-right { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }

    .thread-head {
      max-width: 640px; width: 100%; margin: 0 auto; padding: 0 20px 10px; flex-shrink: 0;
    }
    .page-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--cyan); margin-bottom: 4px; }
    .page-title { font-family: var(--font-serif); font-size: 22px; margin: 0; }
    .page-sub { color: var(--text-dim); font-size: 13px; margin: 4px 0 0; }

    /* scrolling thread */
    .thread {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 6px 0 12px;
    }
    .thread-inner { max-width: 640px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

    .day-divider {
      text-align: center; font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint);
      margin: 10px 0 2px;
    }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; word-wrap: break-word; }
    .msg .who { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 3px; opacity: 0.8; }
    .msg .when { font-family: var(--font-mono); font-size: 9.5px; opacity: 0.55; margin-top: 4px; text-align: right; }
    .msg.them {
      align-self: flex-start;
      background: var(--bg-elev-2); border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .msg.them .who { color: var(--cyan); }
    .msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(8,145,178,0.22));
      border: 1px solid rgba(34,211,238,0.35);
      border-bottom-right-radius: 5px;
    }
    .msg.system {
      align-self: center; max-width: 92%;
      background: transparent; border: 1px dashed var(--border);
      color: var(--text-faint); font-size: 12.5px; text-align: center;
    }

    .empty {
      text-align: center; padding: 36px 24px; color: var(--text-dim); font-size: 14px;
      background: var(--bg-elev-1); border: 1px dashed var(--border); border-radius: 14px;
      margin: 14px 0;
    }
    .empty .big { font-size: 30px; margin-bottom: 10px; }

    /* composer above tab bar */
    .composer-wrap {
      flex-shrink: 0; border-top: 1px solid var(--border);
      background: rgba(15,23,41,0.96); backdrop-filter: blur(12px);
      padding: 10px 0 0;
    }
    .composer {
      max-width: 640px; margin: 0 auto; padding: 0 14px 10px;
      display: flex; gap: 8px; align-items: flex-end;
    }
    .composer textarea {
      flex: 1; resize: none; max-height: 110px;
      background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 14px;
      color: var(--text); font-family: var(--font-sans); font-size: 15px;
      padding: 11px 14px; outline: none; line-height: 1.4;
    }
    .composer textarea:focus { border-color: var(--cyan); background: var(--bg-elev-3); }
    .send-btn {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid var(--cyan); background: var(--cyan); color: var(--navy);
      font-size: 18px; font-weight: 700; cursor: pointer;
      display: grid; place-items: center;
    }
    .send-btn:disabled { opacity: 0.45; }
    .send-btn:active:not(:disabled) { background: var(--accent-green); border-color: var(--accent-green); }

    /* bottom tab bar */
    .tabbar {
      flex-shrink: 0;
      background: rgba(15,23,41,0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .tab {
      flex: 1; max-width: 140px; text-align: center; text-decoration: none;
      color: var(--text-faint); font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 6px 0; border-radius: 10px;
    }
    .tab .ico { display: block; font-size: 19px; margin-bottom: 3px; }
    .tab.active { color: var(--cyan); background: var(--cyan-glow); }

    .veil {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: grid; place-items: center; color: var(--text-faint);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.15s;
    }
    .veil.is-hidden { opacity: 0; pointer-events: none; }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(140px + env(safe-area-inset-bottom));
      background: var(--bg-elev-2); border: 1px solid var(--cyan-deep);
      color: var(--text); font-size: 13px; padding: 11px 16px; border-radius: 10px;
      opacity: 0; transition: 0.25s; pointer-events: none; z-index: 60; max-width: 88vw;
    }
    .toast.show { opacity: 1; }
    .toast.err { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<div class="veil" id="veil">Loading messages…</div>

<header class="nav">
  <div class="brand-mark">OF</div>
  <div class="brand-text">OriginFlow<span class="brand-subtitle">Borrower portal</span></div>
  <div class="nav-right" id="loan-pill">—</div>
</header>

<div class="thread-head">
  <div class="page-eyebrow">Messages</div>
  <h1 class="page-title">Your loan team.</h1>
  <p class="page-sub" id="team-sub">Questions about your loan land here — no phone tag.</p>
</div>

<div class="thread" id="thread">
  <div class="thread-inner" id="thread-inner"></div>
</div>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="composer-input" rows="1" maxlength="2000" placeholder="Write a message…"></textarea>
    <button class="send-btn" id="send-btn" disabled>↑</button>
  </div>
  <nav class="tabbar">
    <a class="tab" href="/portal_index.html"><span class="ico">⌂</span>Home</a>
    <a class="tab" href="/portal_docs.html"><span class="ico">⇪</span>Documents</a>
    <a class="tab active" href="/portal_messages.html"><span class="ico">✉</span>Messages</a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
// =============================================================================
// PORTAL · MESSAGES — borrower ↔ loan-team thread
// -----------------------------------------------------------------------------
// Auth: OF_bootstrap() → { session, borrower, loan }.
//
// [SCHEMA-CONFIRMED 2026-06-10] There is no loan_messages table. Messaging
// runs on the chat system the staff side already uses:
//   chat_channels  (kind='loan', loan_id, branch_id, slug, label)
//   chat_messages  (channel_id, author_id, body, is_system, created_at)
// The borrower posts with author_id = their auth uid. Sender display: any
// message whose author_id ≠ the borrower renders as "Your loan team" —
// borrowers can't join profiles, and that's fine for this surface.
//
// ⚠ ONE REMAINING UNKNOWN: whether chat_channels / chat_messages RLS grants
// the borrower read+insert. If not, this page shows a clean "thread not
// available yet" state and the chat_borrower_rls.sql migration (delivered
// alongside) adds the policies using the same borrower-ownership predicate
// as borrower_can_read_own_conditions.
// =============================================================================

const $ = (s) => document.querySelector(s);
let ctx = null, supa = null, chan = null, channel = null;
let msgs = [];

function toast(m, err){ const t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err);
  t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),3400); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dropVeil(){ const v=$('#veil'); if(!v) return; v.classList.add('is-hidden'); setTimeout(()=>v.remove(),200); }
function pick(row, ...keys){ if(!row) return null; for(const k of keys){ if(row[k] !== undefined && row[k] !== null) return row[k]; } return null; }
function timeStr(iso){ const d=new Date(iso); return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function dayStr(iso){
  const d = new Date(iso); const today = new Date();
  const y = new Date(); y.setDate(today.getDate()-1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// chat_messages semantics: the borrower's messages carry their auth uid.
function isMine(m){ return m.author_id === ctx.session.user.id; }
function bodyOf(m){ return m.body || ''; }
function senderName(m){ return isMine(m) ? 'You' : 'Your loan team'; }

async function init(){
  try { ctx = await window.OF_bootstrap(); }
  catch (e) {
    console.error('[portal/messages] bootstrap failed:', e);
    const code = /not.?a.?borrower|email.?mismatch/i.test(String(e && e.message)) ? 'not_a_borrower' : 'link_failed';
    window.location.replace('/portal_signin.html?error=' + code);
    return;
  }
  if (!ctx || !ctx.session)  { window.location.replace('/portal_signin.html'); return; }
  if (!ctx.borrower)         { window.location.replace('/portal_signin.html?error=not_a_borrower'); return; }
  if (!ctx.loan)             { window.location.replace('/portal_apply.html'); return; }

  supa = window.OF_supabase();
  $('#loan-pill').textContent = 'Loan #' + (ctx.loan.loan_number || ctx.loan.loan_no || '—');

  await loadThread();
  initComposer();
  initRealtime();
  dropVeil();
}

async function loadThread(){
  // 1 · resolve this loan's chat channel
  const { data: ch, error: chErr } = await supa.from('chat_channels')
    .select('id, label, kind, loan_id, branch_id')
    .eq('kind', 'loan')
    .eq('loan_id', ctx.loan.id)
    .maybeSingle();

  if (chErr) {
    console.error('[portal/messages] channel:', chErr);
    $('#thread-inner').innerHTML =
      `<div class="empty"><div class="big">⚠</div>Messages aren't available on your portal yet.<br>Your loan team can still be reached by phone or email.</div>`;
    $('#composer-input').disabled = true;
    return;
  }
  channel = ch || null;

  if (!channel) {
    // No thread yet — first send creates it.
    msgs = [];
    renderThread();
    return;
  }

  // 2 · load the thread
  const { data, error } = await supa.from('chat_messages')
    .select('id, channel_id, author_id, body, is_system, created_at')
    .eq('channel_id', channel.id)
    .order('created_at', { ascending: true })
    .limit(200);

  if (error) {
    console.error('[portal/messages] load:', error);
    $('#thread-inner').innerHTML =
      `<div class="empty"><div class="big">⚠</div>Messages couldn't load right now.<br>Your loan team can still be reached by phone or email.</div>`;
    return;
  }
  msgs = data || [];
  renderThread();
  initRealtime();
}

function renderThread(){
  const inner = $('#thread-inner');
  if (msgs.length === 0) {
    inner.innerHTML = `<div class="empty"><div class="big">👋</div>No messages yet.<br>Say hello — your loan team gets it instantly.</div>`;
    return;
  }
  let lastDay = '';
  inner.innerHTML = msgs.map(m => {
    const created = pick(m,'created_at') || new Date().toISOString();
    const day = dayStr(created);
    const divider = day !== lastDay ? `<div class="day-divider">${esc(day)}</div>` : '';
    lastDay = day;
    const sys = !!pick(m,'is_system');
    if (sys) return divider + `<div class="msg system">${esc(bodyOf(m))}</div>`;
    const mine = isMine(m);
    return divider + `
      <div class="msg ${mine ? 'me' : 'them'}">
        ${!mine ? `<div class="who">${esc(senderName(m))}</div>` : ''}
        <div>${esc(bodyOf(m))}</div>
        <div class="when">${esc(timeStr(created))}</div>
      </div>`;
  }).join('');
  scrollToEnd();
}

function scrollToEnd(){ const t=$('#thread'); requestAnimationFrame(()=>{ t.scrollTop = t.scrollHeight; }); }

function initComposer(){
  const inp = $('#composer-input');
  const btn = $('#send-btn');
  inp.addEventListener('input', () => {
    btn.disabled = !inp.value.trim();
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 110) + 'px';
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) {
      e.preventDefault(); send();
    }
  });
  btn.addEventListener('click', send);
}

async function send(){
  const inp = $('#composer-input');
  const btn = $('#send-btn');
  const body = inp.value.trim();
  if (!body) return;
  btn.disabled = true;

  try {
    // First message creates the loan channel (same slug convention the
    // staff dashboard uses, so both sides land in one thread).
    if (!channel) {
      const { data: newCh, error: createErr } = await supa.from('chat_channels')
        .insert({
          branch_id: ctx.loan.branch_id,
          slug: `loan-${ctx.loan.id}`,
          label: ctx.loan.loan_number || 'Loan',
          kind: 'loan',
          loan_id: ctx.loan.id,
        })
        .select('id, branch_id').single();
      if (createErr) throw createErr;
      channel = newCh;
      initRealtime();
    }

    const { data, error } = await supa.from('chat_messages').insert({
      branch_id: channel.branch_id || ctx.loan.branch_id,
      channel_id: channel.id,
      author_id: ctx.session.user.id,
      body,
    }).select('id, channel_id, author_id, body, is_system, created_at').maybeSingle();
    if (error) throw error;

    inp.value = ''; inp.style.height = 'auto';
    if (data && !msgs.some(m => m.id === data.id)) { msgs.push(data); renderThread(); }
  } catch (err) {
    console.error('[portal/messages] send:', err);
    toast('Message didn\'t send — please try again.', true);
    btn.disabled = false;
    return;
  }
  btn.disabled = true;
}

function initRealtime(){
  if (chan || !channel) return;
  chan = supa.channel(`portal-chat:${channel.id}`)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `channel_id=eq.${channel.id}` },
      (payload) => {
        const row = payload.new;
        if (msgs.some(m => m.id === row.id)) return;   // already optimistic-rendered
        msgs.push(row);
        renderThread();
      })
    .subscribe();
}

init();
</script>

</body>
</html>
