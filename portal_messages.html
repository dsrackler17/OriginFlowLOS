  <style>
    /* =========================================================================
       Phase 11.5.8 — Borrower↔LO messaging (WIRED in 11.5.2)
       -----------------------------------------------------------------------
       Reuses the chat_channels + chat_messages tables that power internal
       branch chat (home.html). The borrower-side surface differs in three
       ways:
         1. Only ONE channel surfaced per page (kind='loan_borrower', scoped
            by loan_id). Internal LO/processor/UW threads aren't even visible
            to borrowers — enforced via RLS, not just UI filtering.
         2. Conversation UI instead of channel-tab UI. One thread, full
            height, mobile-first. Sent vs received differentiated by
            right/left alignment and bubble color.
         3. chat_messages_enriched view used to get author name/role in a
            single query, joining across profiles (internal users) and
            borrowers (the borrower writers).

       Realtime: a single postgres_changes subscription filtered by
       channel_id keeps the thread live without polling. Dedupe by message
       id so the multi-tab borrower case (rare but real) doesn't show
       duplicates.
       ========================================================================= */
    :root {
      --bg: #0b1220;
      --bg-elev-1: #0f1729;
      --bg-elev-2: #15203a;
      --bg-elev-3: #1c2b4d;
      --border: #1f2d4a;
      --border-strong: #2a3d63;
      --text: #e2e8f0;
      --text-dim: #8b9bb8;
      --text-faint: #5a6a87;
      --navy: #0b1220;
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.15);
      --accent-green: #86efac;
      --warn: #fbbf24;
      --danger: #f87171;

      --font-mono: 'Space Mono', ui-monospace, monospace;
      --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'DM Serif Display', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(ellipse 100% 60% at 50% 0%, rgba(34, 211, 238, 0.04), transparent 60%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .portal-banner {
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.1), rgba(134, 239, 172, 0.08));
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-align: center;
    }
    .portal-nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 18, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-shrink: 0;
    }
    .portal-brand { display: flex; align-items: center; gap: 10px; }
    .portal-brand-mark {
      width: 28px; height: 28px; border-radius: 6px;
      background: linear-gradient(135deg, var(--cyan), #0891b2);
      display: grid; place-items: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--navy);
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.3), 0 0 20px rgba(34, 211, 238, 0.2);
    }
    .portal-brand-text { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
    .portal-brand-text .subtitle {
      display: block; font-weight: 400; font-size: 10px;
      color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px;
    }
    .nav-actions {
      display: flex; align-items: center; gap: 14px;
    }
    .back-link, .signout-link {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim); cursor: pointer;
      background: none; border: none; padding: 0;
    }
    .back-link:hover, .signout-link:hover { color: var(--cyan); text-decoration: none; }
    .signout-link:hover { color: var(--danger); }

    .convo-shell {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    @media (min-width: 640px) {
      .convo-shell { padding: 0 24px; }
    }

    .convo-header {
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .convo-lo-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #0891b2);
      display: grid; place-items: center;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 18px;
      color: var(--navy);
      flex-shrink: 0;
      position: relative;
    }
    /* Pulse dot — present only when there's an LO assigned. Driven by
       a class on the avatar element so the "unassigned" empty state
       doesn't display a confusing always-green presence indicator. */
    .convo-lo-avatar.has-lo::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent-green);
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px rgba(134, 239, 172, 0.6);
    }
    .convo-lo-info {

      min-width: 0;
    }
    .convo-eyebrow {

      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 2px;
    }
    .convo-lo-name {
      font-family: var(--font-serif);
      font-size: 22px;
      line-height: 1.1;
      margin: 0 0 2px;
    }
    .convo-lo-meta {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .convo-loan-no {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .day-separator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 4px;
    }
    .day-separator::before,
    .day-separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .day-separator-text {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 80%;
    }
    .message.is-team { align-self: flex-start; }
    .message.is-borrower {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message.is-system {
      align-self: center;

    .message-meta {

      padding: 0 12px;

    .message.is-team .message-author { color: var(--cyan); }
    .message.is-team.is-processor .message-author { color: var(--accent-green); }

    .message.is-team.is-uw .message-author { color: var(--warn); }
    .message.is-team.is-admin .message-author { color: var(--cyan); }
    .message.is-team.is-owner .message-author { color: var(--cyan); }
    /* Co-borrowers render in the "team" slot visually but get a muted
       distinguishing color so the primary borrower can tell them apart
       from the actual lender team. */
    .message.is-team.is-borrower-other .message-author { color: var(--text-dim); }

    .message-bubble {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.is-team .message-bubble {
      background: var(--bg-elev-1);
      border: 1px solid var(--border);
      border-left: 3px solid var(--cyan);
      border-bottom-left-radius: 4px;
    }
    .message.is-team.is-processor .message-bubble { border-left-color: var(--accent-green); }
    .message.is-team.is-underwriter .message-bubble,
    .message.is-team.is-uw .message-bubble        { border-left-color: var(--warn); }
    .message.is-team.is-borrower-other .message-bubble {
      border-left-color: var(--text-dim);
    }
    .message.is-borrower .message-bubble {
      background: var(--cyan-glow);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }
    .message.is-system .message-bubble {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 12px;
      font-style: italic;
      text-align: center;
    }
    /* Newly-arrived (via realtime or send response) messages get a brief
       slide-up so the borrower's eye lands on them. Skipped on initial
       page hydration to avoid animating the whole backlog. */
    .message.is-fresh .message-bubble {
      animation: msgIn 0.28s ease both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }

      background: transparent;

    .send-btn {

    .send-btn:disabled {

    .compose-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 0.04em;

    .toast {

      border-radius: 10px;

      color: var(--text);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;

      max-width: calc(100% - 32px);

    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── BOOTSTRAP LOADING VEIL ─── */

    }
    .live-pill.is-offline::before {
      background: var(--text-faint);
      box-shadow: none;
      animation: none;
    }

<script>
/* =============================================================================
   PORTAL MESSAGES — boot + realtime + send
   -----------------------------------------------------------------------------
   Flow:
     1. init() runs on DOMContentLoaded
     2. OF_bootstrap() resolves { session, borrower, loan }
        (same redirect ladder as the other portal pages)
     3. In parallel:
          - fetchAssignedLO (LO display info)
          - fetchBorrowerChannel (the single kind='loan_borrower' channel
            for this loan; may be null if it hasn't been created yet)
     4. If channel exists:
          - fetchMessages from chat_messages_enriched (with author info)
          - subscribeRealtime to INSERT events on chat_messages, dedupe by id
     5. Compose input enables when channel + send path is ready
     6. Send: real INSERT to chat_messages, returned row appended to thread
        immediately, realtime echo dedupes by id

   Channel resolution:
     - existing → use it
     - missing  → try window.OF_ensureBorrowerChannel(loan_id) hook
     - missing AND no hook → try direct table insert (will fail under RLS
       on a properly-locked-down schema, which is the correct posture)
     - all paths fail → show friendly empty-state, surface error on send
   ============================================================================= */

/* ─── Module-level state ───────────────────────────────────────────────── */
let ctx          = null;   // { session, borrower, loan } from OF_bootstrap
let channel      = null;   // resolved chat_channels row (or null)
let realtimeSub  = null;   // realtime subscription handle (for cleanup)
let messages     = [];     // ordered list of transformed messages
let initialLoad  = true;   // suppress slide-in animation on first paint
let lo           = null;   // resolved LO display info

const MAX_MESSAGES = 200;

/* ─── Helpers ──────────────────────────────────────────────────────────── */

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function titleCase(s) {
  if (!s) return '';
  return String(s).toLowerCase()
    .split(/(\s+|-|')/)
    .map(part => part.length && /^[a-zà-ÿ]/i.test(part)
      ? part.charAt(0).toUpperCase() + part.slice(1)
      : part)
    .join('');
}

function initials(name) {
  if (!name) return '·';
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '·';
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}

function formatDay(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Today';
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

/**
 * Transform an enriched chat row into the shape render() expects. The
 * enriched view (chat_messages_enriched) gives us author_name and
 * author_role joined across profiles + borrowers — both kinds of
 * authors flow through a single code path here.
 *
 * Alignment decision:
 *   - is_system or author_role='system'  → centered system bubble
 *   - author_id === my auth user id      → right-aligned ("me")
 *   - everyone else (team OR co-borrower)→ left-aligned
 *
 * Co-borrowers are tagged with role='borrower-other' so they render in
 * the team slot but with a muted color, distinguishable from real
 * lender-side authors.
 */
function transformMessage(row, opts) {
  const isFresh = !!(opts && opts.fresh);
  const myAuthId = ctx && ctx.session && ctx.session.user && ctx.session.user.id;

  const rawRole = (row.author_role || '').toLowerCase();
  const isSystem = !!row.is_system || rawRole === 'system';
  const isMe = !isSystem && myAuthId && (
    row.author_id === myAuthId ||
    // Fallback: schema may use a separate auth_user_id column on the
    // enriched view to surface the auth.users link for borrowers.
    row.author_auth_user_id === myAuthId
  );

  // Co-borrower? role='borrower' but it's not me.
  const isOtherBorrower = !isSystem && !isMe && rawRole === 'borrower';
  const renderRole = isOtherBorrower ? 'borrower-other' : rawRole || 'team';

  return {
    id:         row.id,
    created_at: row.created_at,
    body:       row.body || '',
    is_system:  isSystem,
    is_me:      !!isMe,
    is_fresh:   isFresh,
    author: {
      name: row.author_name || (isMe ? 'You' : 'Teammate'),
      role: renderRole,
    },
  };
}

/* ─── DB queries ───────────────────────────────────────────────────────── */

/**
 * Resolve the assigned loan officer for the loan. Uses the same
 * borrower-readable view pattern as portal_index — returns null if
 * the view isn't deployed or no LO is assigned yet. The header
 * falls back to a "Your loan team" generic display in that case.
 */
async function fetchAssignedLO(supabase, loan) {
  const loId = loan && (loan.assigned_lo_id || loan.lo_id || loan.loan_officer_id);
  if (!loId) return null;
  try {
    const { data, error } = await supabase
      .from('loan_officers_public')
      .select('first_name, last_name, title, nmls_id')
      .eq('id', loId)
      .maybeSingle();
    if (error || !data) return null;
    const first = titleCase(data.first_name);
    const last  = titleCase(data.last_name);
    const name  = [first, last].filter(Boolean).join(' ');
    return {
      name:  name || 'Your loan officer',
      title: data.title || (data.nmls_id ? 'Loan Officer · NMLS #' + data.nmls_id : 'Loan Officer'),
    };
  } catch (e) {
    console.warn('[portal/messages] LO fetch skipped:', e.message);
    return null;
  }
}

/**
 * Find the one kind='loan_borrower' channel for the loan. Returns null
 * if not yet created — channel auto-creation is handled lazily on first
 * send (see ensureChannel()).
 */
async function fetchBorrowerChannel(supabase, loanId) {
  try {
    const { data, error } = await supabase
      .from('chat_channels')
      .select('id, loan_id, label, kind, branch_id')
      .eq('loan_id', loanId)
      .eq('kind', 'loan_borrower')
      .maybeSingle();
    if (error) {
      console.warn('[portal/messages] channel fetch failed:', error.message);
      return null;
    }
    return data;
  } catch (e) {
    console.warn('[portal/messages] channel fetch exception:', e.message);
    return null;
  }
}

async function fetchMessages(supabase, channelId) {
  try {
    const { data, error } = await supabase
      .from('chat_messages_enriched')
      .select('*')
      .eq('channel_id', channelId)
      .order('created_at', { ascending: true })
      .limit(MAX_MESSAGES);
    if (error) {
      console.warn('[portal/messages] message fetch failed:', error.message);
      return [];
    }
    return data || [];
  } catch (e) {
    console.warn('[portal/messages] message fetch exception:', e.message);
    return [];
  }
}

/**
 * Ensure a channel exists for this loan. Called lazily on first send
 * if fetchBorrowerChannel() came back null at boot.
 *
 * Strategy ladder:
 *   1. Re-fetch — maybe it got created between page load and send
 *   2. Call OF_ensureBorrowerChannel(loan_id) hook if provided by
 *      portal-auth.js (this is the SECURITY DEFINER RPC path — the
 *      correct posture once 11.5.8 backend ships)
 *   3. Last-resort direct INSERT (will fail under properly-locked RLS,
 *      and that's fine — it just means the LO needs to send the first
 *      message to open the thread, which is normal for production)
 *
 * Returns the channel row or throws with a friendly message.
 */
async function ensureChannel(supabase) {
  // 1. Re-fetch (cheap, handles the "LO created the channel since
  //    we loaded" case)
  const existing = await fetchBorrowerChannel(supabase, ctx.loan.id);
  if (existing) return existing;

  // 2. Backend RPC hook (preferred path once 11.5.8 lands)
  if (typeof window.OF_ensureBorrowerChannel === 'function') {
    const created = await window.OF_ensureBorrowerChannel(ctx.loan.id);
    if (created) return created;
  }

  // 3. Direct insert (long shot — RLS will probably block borrowers
  //    from inserting into chat_channels, which is the correct posture)
  try {
    const branchId = ctx.loan.branch_id || ctx.borrower.branch_id;
    const { data, error } = await supabase
      .from('chat_channels')
      .insert({
        branch_id: branchId,
        loan_id:   ctx.loan.id,
        kind:      'loan_borrower',
        label:     'Borrower & loan team',
      })
      .select()
      .single();
    if (error) throw error;
    return data;
  } catch (e) {
    throw new Error(
      'Conversation not opened yet. Your loan officer will reach out — ' +
      'or you can try again in a moment.'
    );
  }
}

/* ─── Realtime ─────────────────────────────────────────────────────────── */

function subscribeRealtime(supabase, channelId) {
  if (realtimeSub) {
    try { supabase.removeChannel(realtimeSub); } catch (_) {}
    realtimeSub = null;
  }

  const pill = document.getElementById('live-pill');
  pill.classList.add('is-offline');
  pill.textContent = 'connecting';

  realtimeSub = supabase
    .channel(`portal-chat:${channelId}`)
    .on(
      'postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `channel_id=eq.${channelId}` },
      async (payload) => {
        const row = payload.new;
        // Dedupe: if we already have this id (because we appended it
        // from the INSERT response), skip. This covers the same-tab
        // echo of our own sends.
        if (messages.some(m => m.id === row.id)) return;

        // Fetch enriched row so we get the author name/role
        try {
          const { data: enriched } = await supabase
            .from('chat_messages_enriched')
            .select('*')
            .eq('id', row.id)
            .maybeSingle();
          if (enriched) {
            appendMessage(transformMessage(enriched, { fresh: true }));
          }
        } catch (e) {
          console.warn('[portal/messages] enrich realtime row failed:', e.message);
        }
      }
    )
    .subscribe((status) => {
      // status is 'SUBSCRIBED' | 'CHANNEL_ERROR' | 'TIMED_OUT' | 'CLOSED'
      if (status === 'SUBSCRIBED') {
        pill.classList.remove('is-offline');
        pill.textContent = 'live';
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        pill.classList.add('is-offline');
        pill.textContent = 'offline';
      }
    });
}

/* ─── State mutation ───────────────────────────────────────────────────── */

function appendMessage(msg) {
  // Insert preserving chronological order. Most realtime echoes arrive
  // in order, but a slow enrich-fetch could land out of order; binary
  // insert keeps the thread coherent.
  const idx = messages.findIndex(m =>
    new Date(m.created_at) > new Date(msg.created_at)
  );
  if (idx < 0) messages.push(msg);
  else         messages.splice(idx, 0, msg);

  render();
}

/* ─── Init ─────────────────────────────────────────────────────────────── */

async function init() {
  try {
    ctx = await window.OF_bootstrap();
  } catch (e) {
    console.error('[portal/messages] OF_bootstrap failed:', e);
    const code = /not.?a.?borrower|email.?mismatch/i.test(String(e && e.message))
      ? 'not_a_borrower'
      : 'link_failed';
    window.location.replace('/portal_signin.html?error=' + code);
    return;
  }

  if (!ctx || !ctx.session) {
    window.location.replace('/portal_signin.html');
    return;
  }
  if (!ctx.borrower) {
    window.location.replace('/portal_signin.html?error=not_a_borrower');
    return;
  }
  if (!ctx.loan) {
    window.location.replace('/portal_apply.html');
    return;
  }

  const supabase = window.OF_supabase();
  const [loRes, channelRes] = await Promise.allSettled([
    fetchAssignedLO(supabase, ctx.loan),
    fetchBorrowerChannel(supabase, ctx.loan.id),
  ]);

  lo      = loRes.status      === 'fulfilled' ? loRes.value      : null;
  channel = channelRes.status === 'fulfilled' ? channelRes.value : null;

  // Populate header now so it shows immediately even if there are no
  // messages yet.
  renderHeader();

  // Compose stays disabled until we know send is at least *attemptable*
  // — i.e., we have a channel OR can plausibly create one. We optimist-
  // ically enable on either condition; the actual send may still fail
  // (handled in sendMessage()).
  const composeReady = !!channel || typeof window.OF_ensureBorrowerChannel === 'function';

  if (channel) {
    const raw = await fetchMessages(supabase, channel.id);
    messages = raw.map(m => transformMessage(m, { fresh: false }));
    render();
    subscribeRealtime(supabase, channel.id);
  } else {
    // No channel yet — render empty state explaining what's going on.
    messages = [];
    render();
  }

  enableCompose(composeReady);
  initialLoad = false;

  // Drop the veil
  const veil = document.getElementById('bootstrap-veil');
  if (veil) {
    veil.classList.add('is-hidden');
    setTimeout(() => veil.remove(), 220);
  }

  if (typeof window.OF_touchLastSeen === 'function') {
    window.OF_touchLastSeen().catch(() => {});
  }
}

/* ─── Render ───────────────────────────────────────────────────────────── */

function renderHeader() {
  const avatarEl = document.getElementById('lo-avatar');
  const nameEl   = document.getElementById('lo-name');
  const metaEl   = document.getElementById('lo-meta');
  const loanEl   = document.getElementById('loan-no');

  if (lo && lo.name) {
    avatarEl.textContent = initials(lo.name);
    avatarEl.classList.add('has-lo');
    nameEl.textContent = lo.name;
    metaEl.textContent = lo.title || 'Loan Officer';
  } else {
    avatarEl.textContent = '·';
    avatarEl.classList.remove('has-lo');
    nameEl.textContent = 'Your loan team';
    metaEl.textContent = 'Being assigned · you can leave a message anytime';
  }

  loanEl.textContent = ctx.loan.loan_no || '—';
}

function render() {
  const thread = document.getElementById('thread');

  if (messages.length === 0) {
    if (channel) {
      thread.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">◌</div>
          <div class="empty-state-title">No messages yet</div>
          <div class="empty-state-subtitle">Send the first message to start a conversation with your loan team.</div>
        </div>
      `;
    } else {
      thread.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">◌</div>
          <div class="empty-state-title">No conversation yet</div>
          <div class="empty-state-subtitle">Your loan team will reach out soon. You can also send the first message — they'll get a notification.</div>
        </div>
      `;
    }
    return;
  }

  // Build DOM. Use innerHTML for simplicity since every value is
  // already escapeHtml'd in the markup builders below.
  let html = '';
  let lastDay = null;
  for (const msg of messages) {
    const day = formatDay(msg.created_at);
    if (day !== lastDay) {
      html += `
        <div class="day-separator">
          <span class="day-separator-text">${escapeHtml(day)}</span>
        </div>
      `;
      lastDay = day;
    }
    html += renderMessageMarkup(msg);
  }
  thread.innerHTML = html;

  // Scroll to bottom on every render. cheap.
  requestAnimationFrame(() => {
    thread.scrollTop = thread.scrollHeight;
  });
}

function renderMessageMarkup(msg) {
  const classList = ['message'];
  if (msg.is_system)      classList.push('is-system');
  else if (msg.is_me)     classList.push('is-borrower');
  else {
    classList.push('is-team');
    if (msg.author.role) classList.push('is-' + msg.author.role);
  }
  if (msg.is_fresh) classList.push('is-fresh');

  const time = formatTime(msg.created_at);
  const author = msg.is_me ? 'You' : (msg.author.name || 'Teammate');

  if (msg.is_system) {
    return `
      <div class="${classList.join(' ')}">
        <div class="message-bubble">${escapeHtml(msg.body)}</div>
      </div>
    `;
  }

  return `
    <div class="${classList.join(' ')}">
      <div class="message-meta">
        ${msg.is_me
          ? `<span>${escapeHtml(time)}</span> · <span class="message-author">${escapeHtml(author)}</span>`
          : `<span class="message-author">${escapeHtml(author)}</span> · <span>${escapeHtml(time)}</span>`}
      </div>
      <div class="message-bubble">${escapeHtml(msg.body)}</div>
    </div>
  `;
}

/* ─── Compose ──────────────────────────────────────────────────────────── */

function enableCompose(enabled) {
  const input = document.getElementById('compose-input');
  const sendBtn = document.getElementById('send-btn');
  if (enabled) {
    input.disabled = false;
    sendBtn.disabled = input.value.trim().length === 0;
  } else {
    input.disabled = true;
    sendBtn.disabled = true;
  }
}

function autoresize(input) {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}

function wireCompose() {
  const input = document.getElementById('compose-input');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('input', () => {
    autoresize(input);
    if (!input.disabled) sendBtn.disabled = input.value.trim().length === 0;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
}

/**
 * Send the composed message. Real INSERT path:
 *   1. Lock input + button
 *   2. Ensure a channel exists (lazy create if needed)
 *   3. INSERT into chat_messages returning the created row
 *   4. Append the returned row to local state immediately (don't wait
 *      for the realtime echo — that arrives ~50–500ms later)
 *   5. Subscribe to realtime if we just created the channel
 *   6. Unlock input
 *
 * The realtime handler dedupes by id, so our local append won't render
 * twice when the echo arrives.
 */
async function sendMessage() {
  const input = document.getElementById('compose-input');
  const sendBtn = document.getElementById('send-btn');
  const body = input.value.trim();
  if (!body) return;

  input.disabled = true;
  sendBtn.disabled = true;

  const supabase = window.OF_supabase();

  try {
    // Ensure channel
    if (!channel) {
      channel = await ensureChannel(supabase);
      // First time opening — subscribe to realtime now that we have a
      // channel id. (If we'd subscribed earlier with no id this would
      // be a no-op.)
      subscribeRealtime(supabase, channel.id);
    }

    // Insert. The schema may require branch_id denormalized on chat_
    // messages too — include it. If your schema doesn't have one of
    // these columns, PostgREST will surface the error and we'll show
    // it in the toast.
    const insertRow = {
      channel_id: channel.id,
      branch_id:  channel.branch_id || ctx.loan.branch_id || ctx.borrower.branch_id,
      author_id:  ctx.session.user.id,
      body:       body,
    };

    const { data, error } = await supabase
      .from('chat_messages')
      .insert(insertRow)
      .select()
      .single();
    if (error) throw error;

    // Append immediately using the real id (so realtime echo will
    // dedupe). We don't have an enriched view row for our own send,
    // so we synthesize one from what we already know about ourselves.
    const myName = [ctx.borrower.first_name, ctx.borrower.last_name]
      .map(titleCase).filter(Boolean).join(' ') || 'You';
    appendMessage(transformMessage({
      id:          data.id,
      created_at:  data.created_at,
      body:        data.body,
      author_id:   data.author_id,
      author_name: myName,
      author_role: 'borrower',
      is_system:   false,
    }, { fresh: true }));

    input.value = '';
    autoresize(input);
  } catch (err) {
    console.error('[portal/messages] send failed:', err);
    showToast("Couldn't send. " + (err.message || ''), true);
  } finally {
    input.disabled = false;
    sendBtn.disabled = input.value.trim().length === 0;
    input.focus();
  }
}

/* ─── Toast ────────────────────────────────────────────────────────────── */

let toastTimer = null;
function showToast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('is-error', !!isError);
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-visible'), 4000);
}

/* ─── Lifecycle ────────────────────────────────────────────────────────── */

document.addEventListener('DOMContentLoaded', () => {
  init();
  wireCompose();
});

// Clean up the realtime subscription if the user navigates away. Without
// this, hot-reloads or back/forward navigation can leave dangling channel
// references and rack up extra Supabase connections.
window.addEventListener('beforeunload', () => {
  if (realtimeSub) {
    try {
      const supabase = window.OF_supabase();
      supabase.removeChannel(realtimeSub);
    } catch (_) {}
    realtimeSub = null;
  }
});
</script>
