; =============================================================================
; OriginFlow worker — supervisord config
; =============================================================================
;
; Three programs managed by supervisord. If any dies, supervisord
; restarts it. If a program crash-loops past its startretries budget,
; supervisord gives up — the container's healthcheck fails — and
; Fly.io replaces the VM.
;
; Log handling: every program writes to /dev/fd/1 (stdout) or /dev/fd/2
; (stderr). supervisord forwards those to its own stdout/stderr, which
; are the container's stdout/stderr, which Fly.io captures.
; `fly logs` shows all three streams interleaved.
;
; Priority controls boot order: clamd first (signature DB load takes
; 15-30s), freshclam second, Deno worker last.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid


; -----------------------------------------------------------------------------
; clamd — ClamAV daemon
; -----------------------------------------------------------------------------
; Listens on 127.0.0.1:3310. Holds the signature DB in memory (~700 MB
; resident). Why the container needs 1 GB minimum.
; -----------------------------------------------------------------------------
[program:clamd]
command=/usr/sbin/clamd --foreground=true
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10
; clamd takes 15-30 seconds to load signatures on cold start.
startsecs=20


; -----------------------------------------------------------------------------
; freshclam — ClamAV signature updater
; -----------------------------------------------------------------------------
; Runs continuously, checking for signature updates every hour
; (--checks=24 → 24 times per day). On finding updates, downloads them
; and signals clamd to reload.
; -----------------------------------------------------------------------------
[program:freshclam]
command=/usr/bin/freshclam --foreground --daemon --checks=24
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
startsecs=5


; -----------------------------------------------------------------------------
; worker — Deno LISTEN process
; -----------------------------------------------------------------------------
; Permissions:
;   --allow-net   — Postgres connection, Anthropic API, ClamAV TCP,
;                   Supabase REST, healthcheck server
;   --allow-env   — read config from env (config.ts)
;   --allow-read  — read source files
;
; Deliberately NOT --allow-write, --allow-run, --allow-sys. The worker
; writes nothing to disk and shells out to nothing.
; -----------------------------------------------------------------------------
[program:worker]
command=/usr/local/bin/deno run --allow-net --allow-env --allow-read /app/main.ts
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30
startsecs=5
stopsignal=TERM
stopwaitsecs=30
